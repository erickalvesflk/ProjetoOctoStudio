<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - Octostudio</title>
</head>
<body>
    <header></header>

    <main>

        <section class="section_main" id="about-section">
            <section id="about-container">
                <div id="info">
                    <div>
                        <div class="section-title">
                            <h1>Sobre</h1>
                        </div>
                        <p>O projeto octostudio tem como objetivo introduzir o estudante ao mundo da programação. Apartir da criação de jogos divertidos pelo aplicativo octostudio</p>
                    </div>
                    <div>
                        <a class="btn" id="subscribe-btn" href="#">Inscreva-se</a>
                        <a class="btn" id="see-games-btn" href="#">Ver Jogos</a>
                    </div>
                </div>
                <img src="web/imgs/main/octoEx.png" alt="Exemplo de código no octostudio">
            </section>
        </section>


        <section class="section_main" id="members-section">
            <section id="members-container">
                <div class="section-title">
                    <h1>Participantes</h1>
                </div>
                <div id="members-grid">
                    <div class="member-container">
                        <div class="member-info">
                            <img src="" alt="Imagem do participante">
                            <h2>Nome</h2>
                        </div>
                        <a class="btn btn-member" href="#">Contatos</a>
                    </div>
                </div>
            </section>
        </section>


        <section class="section_main" id="games-section">
            <section id="games-container">
                <div class="section-title">
                    <h1>Jogos</h1>
                </div>
                <div id="games-carousel">
                    <div class="game-container">
                        <div class="game-info">
                            <img src="" alt="Imagem do participante">
                            <h2>Nome do Jogo</h2>
                        </div>
                        <a class="btn-game" href="#">Veja mais</a>
                    </div>
                </div>
            </section>            
        </section>

    </main>

    <footer></footer>
</body>
</html>
