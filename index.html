<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - Octostudio</title>
    <script src="https://kit.fontawesome.com/e625421ec6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="web/style/index.css">
    <link rel="stylesheet" href="web/style/index_midiaquery.css">
</head>
<body>
    <header></header>

    <main>

        <section class="section_main" id="about-section">
            <section id="about-container">
                <div id="about-info">
                    <div>
                        <div class="section-title" id="about-section-title">
                            <h1>Projeto OctoStudio</h1>
                        </div>
                        <p>O projeto "OctoStudio" tem como objetivo introduzir o estudante ao mundo da programação. A partir da criação de jogos divertidos por meio do aplicativo OctoStudio, desenvolvido pelo MIT.</p>
                    </div>
                    <div id="about-btns">
                        <a class="btn" id="subscribe-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSde79rnyc9SnP2ya47z7bzudZkwRgYZ8uAuV1IWm8xmR41_AQ/viewform">Inscreva-se</a>
                        <a class="btn" id="see-games-btn" href="#games-section">Ver Jogos</a>
                    </div>
                </div>
                <img src="web/imgs/main/octoEx.png" alt="Exemplo de código no octostudio">
            </section>
        </section>


        <section class="section_main" id="members-section">
            <section id="members-container">
                <div class="section-title">
                    <i class="fa-solid fa-user-group icon-title"></i>
                    <h1>Participantes</h1>
                </div>
                <div id="members-grid">
                    <div class="member-container" id="prof-container">
                        <div class="member-info">
                            <img src="web/imgs/members/adriana.svg" alt="Imagem do participante">
                            <h2>Andriana Sicsú</h2>
                        </div>
                        <a class="btn btn-member" href="#" style="background-color: gray;">Contatos</a>
                    </div>
                </div>
            </section>
        </section>


        <section class="section_main" id="games-section">
            <section id="games-container">
                <div class="section-title">
                    <i class="fa-solid fa-gamepad icon-title"></i>
                    <h1>Jogos</h1>
                </div>
                <div id="games-carousel-container">
                    <div id="games-carousel">
                    </div>
                    <div id="games-carousel-arrows">
                        <div id="arrow-left">
                            <div><i class="fa-solid fa-arrow-left"></i></div>
                        </div>
                        <div id="arrow-right">
                            <div><i class="fa-solid fa-arrow-right"></i></div>
                        </div>
                    </div>
                </div>
            </section>            
        </section>

    </main>

    <footer></footer>
    <script src="web/scripts/index.js" type="module"></script>
    <script src="web/scripts/header.js" type="module"></script>
    <script src="web/scripts/footer.js" type="module"></script>

</body>
</html>
